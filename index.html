<!DOCTYPE html>
<html>
<head>
    <title>COMBAT‑AID Commander Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Firebase SDKs (v9 modular, but we use compat for simplicity) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        body { margin:0; padding:0; }
        #map { position:absolute; top:0; bottom:0; width:100%; }
        #soldier-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 280px;
            background: rgba(30,30,30,0.9);
            color: white;
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            z-index: 1000;
            backdrop-filter: blur(4px);
            pointer-events: auto;
            max-height: 85%;
            overflow-y: auto;
            border: 1px solid #3a6ea5;
        }
        #soldier-panel h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            text-align: center;
            color: #ffd966;
        }
        .soldier-entry {
            border-bottom: 1px solid #555;
            padding: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .soldier-entry:hover { background: #3a6ea5; }
        .soldier-id { font-weight: bold; font-size: 13px; }
        .soldier-status { font-size: 10px; margin-top: 4px; }
        .online { color: #2ecc71; }
        .offline { color: #95a5a6; }
        .sos { color: #e74c3c; font-weight: bold; }
        .health { font-size: 11px; margin-top: 2px; }
        .broadcast-area {
            margin-top: 12px;
            border-top: 1px solid #555;
            padding-top: 10px;
            display: flex;
            gap: 6px;
        }
        #broadcastMsg {
            flex: 1;
            padding: 6px;
            border-radius: 4px;
            border: none;
            background: #444;
            color: white;
        }
        #broadcastBtn {
            background: #3a6ea5;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        #broadcastBtn:hover { background: #2c4e73; }
        #toast-msg {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            color: #0f0;
            padding: 8px 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            z-index: 1001;
            display: none;
        }
    </style>
</head>
<body>
    <div id="soldier-panel">
        <h3>📡 SOLDIER STATUS</h3>
        <div id="soldier-list">Loading...</div>
        <div class="broadcast-area">
            <input type="text" id="broadcastMsg" placeholder="Commander message..." />
            <button id="broadcastBtn">📢 Send</button>
        </div>
    </div>
    <div id="map"></div>
    <div id="toast-msg"></div>

    <script>
        // ==================== FIREBASE CONFIG (YOURS) ====================
        const firebaseConfig = {
            apiKey: "AIzaSyABCm88C1TRQXffPOP4rZOjN7bcPuTUQhg",
            authDomain: "combat-aid.firebaseapp.com",
            databaseURL: "https://combat-aid-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "combat-aid",
            storageBucket: "combat-aid.firebasestorage.app",
            messagingSenderId: "454132547541",
            appId: "1:454132547541:web:2457e77a43989d675f875c",
            measurementId: "G-ZHQ9J8NCDP"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        // Anonymous sign-in (required for Firestore write)
        firebase.auth().signInAnonymously()
            .then(() => console.log("Firebase auth success"))
            .catch(err => console.error("Auth error:", err));

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast-msg');
            toast.textContent = msg;
            toast.style.color = isError ? '#f66' : '#0f0';
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        // ==================== MAP (Patna, OSM tiles) ====================
        const map = L.map('map').setView([25.5941, 85.1376], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let markers = {};

        function addMarker(id, lat, lon, color, label) {
            if (markers[id]) {
                markers[id].setLatLng([lat, lon]);
                markers[id].setStyle({ fillColor: color, color: color });
                markers[id].setPopupContent(label);
            } else {
                const marker = L.circleMarker([lat, lon], {
                    radius: 10,
                    fillColor: color,
                    color: color,
                    weight: 1,
                    opacity: 1,
                    fillOpacity: 0.8
                }).addTo(map);
                if (label) marker.bindPopup(label);
                markers[id] = marker;
            }
        }

        function removeMarker(id) {
            if (markers[id]) {
                map.removeLayer(markers[id]);
                delete markers[id];
            }
        }

        function updateSoldierList(soldiersArray) {
            const listDiv = document.getElementById('soldier-list');
            if (!listDiv) return;
            if (!soldiersArray || soldiersArray.length === 0) {
                listDiv.innerHTML = '<div style="text-align:center;">No soldiers online</div>';
                return;
            }
            let html = '';
            soldiersArray.forEach(s => {
                let statusHtml = '';
                if (s.sos) statusHtml += '<span class="sos">🔴 SOS</span><br>';
                const onlineClass = s.isOnline ? 'online' : 'offline';
                const onlineText = s.isOnline ? '● Online' : '○ Offline';
                statusHtml += `<span class="${onlineClass}">${onlineText}</span>`;
                html += `<div class="soldier-entry" onclick="centerOn(${s.lat}, ${s.lon})">
                            <div class="soldier-id">🎖️ ${s.idShort}</div>
                            <div class="health">❤️ ${s.heartRate} bpm &nbsp; 🌡️ ${s.temperature}°C</div>
                            <div class="soldier-status">${statusHtml}</div>
                         </div>`;
            });
            listDiv.innerHTML = html;
        }

        function centerOn(lat, lon) {
            map.setView([lat, lon], 15);
        }

        // ==================== BROADCAST BUTTON (Direct Firestore Write) ====================
        document.getElementById('broadcastBtn').addEventListener('click', () => {
            const msg = document.getElementById('broadcastMsg').value.trim();
            if (msg === "") return;

            db.collection("broadcasts").add({
                message: msg,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                sender: "commander"
            }).then(() => {
                showToast(`✅ Broadcast sent: "${msg}"`);
                document.getElementById('broadcastMsg').value = "";
            }).catch(err => {
                console.error("Firestore write error:", err);
                showToast(`❌ Error: ${err.message}`, true);
            });
        });

        // Small debug to confirm Firebase is ready
        console.log("HTML page fully loaded, Firebase initialised.");
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>COMBAT‑AID Commander Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin:0; padding:0; }
        #map { position:absolute; top:0; bottom:0; width:100%; }
        #soldier-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 280px;
            background: rgba(30,30,30,0.9);
            color: white;
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            z-index: 1000;
            backdrop-filter: blur(4px);
            pointer-events: auto;
            max-height: 85%;
            overflow-y: auto;
            border: 1px solid #3a6ea5;
        }
        #soldier-panel h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            text-align: center;
            color: #ffd966;
        }
        .soldier-entry {
            border-bottom: 1px solid #555;
            padding: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .soldier-entry:hover { background: #3a6ea5; }
        .soldier-id { font-weight: bold; font-size: 13px; }
        .soldier-status { font-size: 10px; margin-top: 4px; }
        .online { color: #2ecc71; }
        .offline { color: #95a5a6; }
        .sos { color: #e74c3c; font-weight: bold; }
        .health { font-size: 11px; margin-top: 2px; }
        .broadcast-area {
            margin-top: 12px;
            border-top: 1px solid #555;
            padding-top: 10px;
            display: flex;
            gap: 6px;
        }
        #broadcastMsg {
            flex: 1;
            padding: 6px;
            border-radius: 4px;
            border: none;
            background: #444;
            color: white;
        }
        #broadcastBtn {
            background: #3a6ea5;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        #broadcastBtn:hover { background: #2c4e73; }
    </style>
</head>
<body>
    <div id="soldier-panel">
        <h3>📡 SOLDIER STATUS</h3>
        <div id="soldier-list">Loading...</div>
        <div class="broadcast-area">
            <input type="text" id="broadcastMsg" placeholder="Commander message..." />
            <button id="broadcastBtn">📢 Send</button>
        </div>
    </div>
    <div id="map"></div>
    <script>
        // Center on Patna
        var map = L.map('map').setView([25.5941, 85.1376], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/attribution">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        var markers = {};

        function addMarker(id, lat, lon, color, label) {
            if (markers[id]) {
                markers[id].setLatLng([lat, lon]);
                markers[id].setStyle({ fillColor: color, color: color });
                markers[id].setPopupContent(label);
            } else {
                var marker = L.circleMarker([lat, lon], {
                    radius: 10,
                    fillColor: color,
                    color: color,
                    weight: 1,
                    opacity: 1,
                    fillOpacity: 0.8
                }).addTo(map);
                if (label) marker.bindPopup(label);
                markers[id] = marker;
            }
        }

        function removeMarker(id) {
            if (markers[id]) {
                map.removeLayer(markers[id]);
                delete markers[id];
            }
        }

        function updateSoldierList(soldiersArray) {
            var listDiv = document.getElementById('soldier-list');
            if (!listDiv) return;
            if (!soldiersArray.length) {
                listDiv.innerHTML = '<div style="text-align:center;">No soldiers online</div>';
                return;
            }
            var html = '';
            soldiersArray.forEach(function(s) {
                // Status line: SOS first, then online/offline
                var statusHtml = '';
                if (s.sos) {
                    statusHtml += '<span class="sos">🔴 SOS</span><br>';
                }
                var onlineClass = s.isOnline ? 'online' : 'offline';
                var onlineText = s.isOnline ? '● Online' : '○ Offline';
                statusHtml += '<span class="' + onlineClass + '">' + onlineText + '</span>';
                
                html += '<div class="soldier-entry" onclick="centerOn(' + s.lat + ', ' + s.lon + ')">';
                html += '<div class="soldier-id">🎖️ ' + s.idShort + '</div>';
                html += '<div class="health">❤️ ' + s.heartRate + ' bpm &nbsp; 🌡️ ' + s.temperature + '°C</div>';
                html += '<div class="soldier-status">' + statusHtml + '</div>';
                html += '</div>';
            });
            listDiv.innerHTML = html;
        }

        function centerOn(lat, lon) {
            map.setView([lat, lon], 15);
        }

        document.getElementById('broadcastBtn').addEventListener('click', function() {
            var msg = document.getElementById('broadcastMsg').value;
            if (msg.trim() === "") return;
            prompt("broadcast:" + msg);
            document.getElementById('broadcastMsg').value = "";
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>COMBAT‑AID Commander Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Chart.js for graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        body { margin:0; padding:0; }
        #map { position:absolute; top:0; bottom:0; width:100%; }
        #soldier-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 280px;
            background: rgba(30,30,30,0.9);
            color: white;
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            z-index: 1000;
            backdrop-filter: blur(4px);
            pointer-events: auto;
            max-height: 85%;
            overflow-y: auto;
            border: 1px solid #3a6ea5;
        }
        #soldier-panel h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            text-align: center;
            color: #ffd966;
        }
        .filter-buttons {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }
        .filter-btn {
            flex: 1;
            background: #3a6ea5;
            border: none;
            color: white;
            padding: 4px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
        .filter-btn.active {
            background: #ff9800;
            color: black;
            font-weight: bold;
        }
        .soldier-entry {
            border-bottom: 1px solid #555;
            padding: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .soldier-entry:hover { background: #3a6ea5; }
        .soldier-id { font-weight: bold; font-size: 13px; }
        .soldier-status { font-size: 10px; margin-top: 4px; }
        .online { color: #2ecc71; }
        .offline { color: #95a5a6; }
        .sos { color: #e74c3c; font-weight: bold; }
        .health { font-size: 11px; margin-top: 2px; }
        .broadcast-area {
            margin-top: 12px;
            border-top: 1px solid #555;
            padding-top: 10px;
            display: flex;
            gap: 6px;
        }
        #broadcastMsg {
            flex: 1;
            padding: 6px;
            border-radius: 4px;
            border: none;
            background: #444;
            color: white;
        }
        #broadcastBtn {
            background: #3a6ea5;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        #broadcastBtn:hover { background: #2c4e73; }
        #toast-msg {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            color: #0f0;
            padding: 8px 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            z-index: 1002;
            display: none;
        }
        /* Alert log panel */
        .alert-log {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 260px;
            background: rgba(0,0,0,0.85);
            color: #ffaa66;
            border-radius: 8px;
            padding: 8px;
            font-family: monospace;
            font-size: 11px;
            z-index: 1000;
            backdrop-filter: blur(4px);
            border: 1px solid #e74c3c;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }
        .alert-log.show { display: block; }
        .alert-title {
            cursor: pointer;
            padding: 4px;
            background: #3a6ea5;
            text-align: center;
            border-radius: 4px;
            margin-bottom: 6px;
        }
        .alert-entry {
            border-bottom: 1px solid #555;
            padding: 4px;
            font-size: 10px;
        }
        /* Top-right buttons */
        .top-right-buttons {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1001;
            display: flex;
            gap: 8px;
        }
        .top-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
        .clear-sos-btn { background: #ff9800; color: black; }
        .export-btn { background: #2ecc71; color: black; }
        /* Mission timer */
        .mission-timer {
            position: absolute;
            top: 10px;
            right: 380px;
            background: #333;
            color: #0f0;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            z-index: 1001;
            font-size: 12px;
        }
        /* Map legend */
        .map-legend {
            position: absolute;
            bottom: 20px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 6px 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 10px;
            z-index: 1000;
            color: white;
            pointer-events: none;
        }
        .legend-color {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 4px;
        }
        /* Graph modal */
        #graphModal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 420px;
            background: #222;
            color: white;
            padding: 20px;
            border-radius: 8px;
            z-index: 1003;
            border: 1px solid #ff9800;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #graphModal h4 { margin-top: 0; text-align: center; }
        #closeGraphBtn {
            margin-top: 10px;
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px;
            border-radius: 4px;
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="soldier-panel">
        <h3>📡 SOLDIER STATUS <span id="soldier-count" style="font-size:11px; background:#3a6ea5; padding:2px 6px; border-radius:12px;">0</span></h3>
        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="online">Online</button>
            <button class="filter-btn" data-filter="sos">SOS</button>
        </div>
        <div id="soldier-list">Loading...</div>
        <div class="broadcast-area">
            <input type="text" id="broadcastMsg" placeholder="Commander message..." />
            <button id="broadcastBtn">📢 Send</button>
        </div>
    </div>
    <div id="map"></div>
    <div id="toast-msg"></div>

    <!-- Top row: timer and buttons -->
    <div class="mission-timer" id="missionTimer">⏱️ Mission: 00:00</div>
    <div class="top-right-buttons">
        <button class="top-btn" id="showAlertsBtn">📋 SOS</button>
        <button class="top-btn clear-sos-btn" id="clearSOSBtn">🧹 Clear SOS</button>
        <button class="top-btn export-btn" id="exportBtn">📁 Export CSV</button>
    </div>
    <div class="alert-log" id="alertLog">
        <div class="alert-title" onclick="toggleAlertLog()">🔔 SOS ALERTS (click to hide)</div>
        <div id="alertList">No alerts yet</div>
    </div>
    <div class="map-legend">
        <div><span class="legend-color" style="background:#2ecc71;"></span> Healthy</div>
        <div><span class="legend-color" style="background:#ff9800;"></span> Moderate risk</div>
        <div><span class="legend-color" style="background:#e74c3c;"></span> High risk / SOS</div>
        <div><span class="legend-color" style="background:#95a5a6;"></span> Offline</div>
    </div>

    <!-- Graph Modal -->
    <div id="graphModal">
        <h4>Heart Rate History</h4>
        <canvas id="hrChart" width="400" height="200"></canvas>
        <button id="closeGraphBtn">Close</button>
    </div>

    <script>
        // ==================== FIREBASE CONFIG (YOURS) ====================
        const firebaseConfig = {
            apiKey: "AIzaSyABCm88C1TRQXffPOP4rZOjN7bcPuTUQhg",
            authDomain: "combat-aid.firebaseapp.com",
            databaseURL: "https://combat-aid-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "combat-aid",
            storageBucket: "combat-aid.firebasestorage.app",
            messagingSenderId: "454132547541",
            appId: "1:454132547541:web:2457e77a43989d675f875c",
            measurementId: "G-ZHQ9J8NCDP"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        firebase.auth().signInAnonymously().catch(err => console.error("Auth error:", err));

        // ==================== MISSION TIMER ====================
        let missionStart = Date.now();
        setInterval(() => {
            let elapsed = Math.floor((Date.now() - missionStart) / 1000);
            let mins = Math.floor(elapsed / 60);
            let secs = elapsed % 60;
            document.getElementById('missionTimer').innerHTML = `⏱️ Mission: ${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
        }, 1000);

        // ==================== UTILITIES ====================
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast-msg');
            toast.textContent = msg;
            toast.style.color = isError ? '#f66' : '#0f0';
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        // ==================== MAP ====================
        const map = L.map('map').setView([25.5941, 85.1376], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        let markers = {};

        function addMarker(id, lat, lon, color, label) {
            if (markers[id]) {
                markers[id].setLatLng([lat, lon]);
                markers[id].setStyle({ fillColor: color, color: color });
                markers[id].setPopupContent(label);
            } else {
                const marker = L.circleMarker([lat, lon], {
                    radius: 10,
                    fillColor: color,
                    color: color,
                    weight: 1,
                    opacity: 1,
                    fillOpacity: 0.8
                }).addTo(map);
                if (label) marker.bindPopup(label);
                markers[id] = marker;
            }
        }

        function removeMarker(id) {
            if (markers[id]) {
                map.removeLayer(markers[id]);
                delete markers[id];
            }
        }

        // Raw soldier data
        let allSoldiers = [];
        let currentFilter = 'all';

        function updateSoldierList(soldiersArray) {
            allSoldiers = soldiersArray;
            applyFilter();
            const countSpan = document.getElementById('soldier-count');
            if (countSpan) countSpan.innerText = soldiersArray.length;
        }

        function applyFilter() {
            let filtered = [];
            if (currentFilter === 'all') filtered = allSoldiers;
            else if (currentFilter === 'online') filtered = allSoldiers.filter(s => s.isOnline);
            else if (currentFilter === 'sos') filtered = allSoldiers.filter(s => s.sos);
            const listDiv = document.getElementById('soldier-list');
            if (!listDiv) return;
            if (!filtered.length) {
                listDiv.innerHTML = '<div style="text-align:center;">No soldiers match</div>';
                return;
            }
            let html = '';
            filtered.forEach(s => {
                let statusHtml = '';
                if (s.sos) statusHtml += '<span class="sos">🔴 SOS</span><br>';
                const onlineClass = s.isOnline ? 'online' : 'offline';
                const onlineText = s.isOnline ? '● Online' : '○ Offline';
                statusHtml += `<span class="${onlineClass}">${onlineText}</span>`;
                html += `<div class="soldier-entry" onclick="showSoldierGraph('${s.soldierId}', '${s.idShort}')">
                            <div class="soldier-id">🎖️ ${s.idShort}</div>
                            <div class="health">❤️ ${s.heartRate} bpm &nbsp; 🌡️ ${s.temperature}°C</div>
                            <div class="soldier-status">${statusHtml}</div>
                         </div>`;
            });
            listDiv.innerHTML = html;
        }

        // ==================== GRAPH MODAL ====================
        let currentChart = null;
        async function showSoldierGraph(soldierId, soldierName) {
            const modal = document.getElementById('graphModal');
            modal.style.display = 'block';
            try {
                const historyRef = db.collection("users").doc(soldierId).collection("health_history").orderBy("timestamp", "desc").limit(10);
                const snap = await historyRef.get();
                const heartRates = [];
                const labels = [];
                snap.docs.reverse().forEach(doc => {
                    heartRates.push(doc.data().heartRate);
                    let time = doc.data().timestamp?.toDate().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) || '';
                    labels.push(time);
                });
                const ctx = document.getElementById('hrChart').getContext('2d');
                if (currentChart) currentChart.destroy();
                currentChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{ label: `Heart Rate (bpm) - ${soldierName}`, data: heartRates, borderColor: '#ff6384', tension: 0.2 }]
                    },
                    options: { responsive: false, maintainAspectRatio: true }
                });
            } catch (err) {
                console.error(err);
                showToast("Failed to load heart rate history", true);
            }
        }
        document.getElementById('closeGraphBtn').addEventListener('click', () => {
            document.getElementById('graphModal').style.display = 'none';
        });

        // ==================== CSV EXPORT ====================
        function exportToCSV() {
            let csvRows = [["Soldier ID", "Latitude", "Longitude", "Heart Rate", "Temperature", "Online", "SOS"]];
            allSoldiers.forEach(s => {
                csvRows.push([s.idShort, s.lat, s.lon, s.heartRate, s.temperature, s.isOnline ? "Yes" : "No", s.sos ? "Yes" : "No"]);
            });
            const csvContent = csvRows.map(row => row.join(",")).join("\n");
            const blob = new Blob([csvContent], { type: "text/csv" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `combat_aid_soldiers_${new Date().toISOString().slice(0,19)}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showToast("CSV exported");
        }
        document.getElementById('exportBtn').addEventListener('click', exportToCSV);

        // ==================== ALERT LOG ====================
        function toggleAlertLog() {
            document.getElementById('alertLog').classList.toggle('show');
        }
        function updateAlertLog(alertsArray) {
            const container = document.getElementById('alertList');
            if (!container) return;
            if (!alertsArray.length) {
                container.innerHTML = 'No alerts yet';
                return;
            }
            let html = '';
            alertsArray.slice(0,5).forEach(a => {
                html += `<div class="alert-entry">🚨 ${a.soldierId} - ${a.timestamp}</div>`;
            });
            container.innerHTML = html;
        }

        // ==================== CLEAR SOS ====================
        async function clearAllSOS() {
            showToast("Clearing all SOS alerts...");
            try {
                const alertsSnap = await db.collection("alerts").where("acknowledged", "==", false).get();
                const batch1 = db.batch();
                alertsSnap.forEach(doc => batch1.update(doc.ref, { acknowledged: true }));
                await batch1.commit();
                const soldiersSnap = await db.collection("users").where("role", "==", "soldier").get();
                const batch2 = db.batch();
                soldiersSnap.forEach(doc => batch2.update(doc.ref, { sos: false }));
                await batch2.commit();
                showToast("✅ All SOS cleared");
            } catch (err) {
                console.error(err);
                showToast("❌ Error clearing SOS: " + err.message, true);
            }
        }
        document.getElementById('clearSOSBtn').addEventListener('click', clearAllSOS);

        // ==================== BROADCAST ====================
        document.getElementById('broadcastBtn').addEventListener('click', () => {
            const msg = document.getElementById('broadcastMsg').value.trim();
            if (msg === "") return;
            db.collection("broadcasts").add({
                message: msg,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                sender: "commander"
            }).then(() => {
                showToast(`✅ Broadcast sent: "${msg}"`);
                document.getElementById('broadcastMsg').value = "";
            }).catch(err => {
                console.error(err);
                showToast(`❌ Error: ${err.message}`, true);
            });
        });

        document.getElementById('showAlertsBtn').addEventListener('click', toggleAlertLog);

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.getAttribute('data-filter');
                applyFilter();
            });
        });

        console.log("HTML fully loaded");
    </script>
</body>
</html>
